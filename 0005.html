<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>broken wing clock</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F3EEE1;                        /* cream */
  }
  #clock {
    width: min(90vw, 90vh);
    height: auto;
  }
</style>
</head>
<body>

<svg id="clock" viewBox="130 30 420 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clock made from the sentence its not a broken wing its a glock 19">
  <defs>
    <path id="topHalf" d="M170 220 A170 170 0 0 1 510 220" fill="none"/>
    <path id="bottomHalf" d="M510 220 A170 170 0 0 1 170 220" fill="none"/>
  </defs>
  <g id="disc"></g>       <!-- ring: empty at the top of each minute; the seconds write the sentence letter by letter -->
  <g id="hourHand"></g>   <!-- "broken wing" -->
  <g id="minuteHand"></g> <!-- "glock 19" -->
</svg>

<script>
(function () {
  // ---------- Settings ----------
  const SENTENCE      = 'its not a broken wing its a glock 19';
  const PARTS         = ['its not a ', 'broken wing', ' its a ', 'glock 19'];
  const FONT          = "'Futura', 'Futura PT', sans-serif";
  const FONT_SIZE     = 29;
  const LINE          = 0.8;  // each letter's edge is drawn in its own colour at this weight, so no outline shows
  const FADE_IN       = 0.12; // seconds for a new letter to appear
  const FADE_DOWN     = 0.3;  // seconds for a letter to shift to its next colour when the next letter appears
  const WIPE          = 0.6;  // seconds for the finished sentence to fade out at the top of the minute

  // Colours
  const CREAM_CSS = '#F3EEE1'; // background; letters not yet written are drawn in exactly this, so they are invisible
  const HOUR_CSS  = '#FFFFFF'; // "broken wing": white
  const MIN_CSS   = '#C6C9CC'; // "glock 19": light silver
  // Trail colours, as display-p3 values where the screen can show them, standard values otherwise
  const P3 = window.CSS && CSS.supports && CSS.supports('color', 'color(display-p3 1 1 1)');
  const RED    = P3 ? [0.8344, 0.1785, 0.1434] : [0xE8 / 255, 0, 0x0F / 255];          // red from 0002
  const ORANGE = P3 ? [0.929, 0.4387, 0.1782]  : [1, 0x66 / 255, 0];                   // hi-viz orange from 0003
  const YELLOW = P3 ? [0.9, 1, 0]              : [0xE1 / 255, 1, 0];                   // hi-viz yellow from 0002
  const CREAM  = P3 ? [0.9495, 0.934, 0.8874]  : [0xF3 / 255, 0xEE / 255, 0xE1 / 255]; // the background, for fading to and from it
  // Colour of a letter by how many letters it is behind the newest one. Past the last entry it stays that colour.
  const TRAIL  = [[0, RED], [2, ORANGE], [4, YELLOW]];
  const css = c => P3
    ? 'color(display-p3 ' + c.map(v => v.toFixed(4)).join(' ') + ')'
    : 'rgb(' + c.map(v => Math.round(v * 255)).join(',') + ')';
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  // ------------------------------

  const CX = 340, CY = 220;
  const style = colour => "font-family:" + FONT + ";font-weight:700;font-size:" + FONT_SIZE +
    "px;fill:" + colour + ";stroke:" + colour + ";stroke-width:" + LINE + "px;stroke-linejoin:round;white-space:pre";
  const pathAttrs = ' startOffset="50%" text-anchor="middle" textLength="515" lengthAdjust="spacing"';

  // Ring with one tspan per character so each can be written. Unwritten letters are cream on cream.
  function ringText(pathId) {
    const spans = [...SENTENCE].map(c =>
      '<tspan' + (c === ' ' ? '' : ' data-ch="1"') + '>' + c + '</tspan>'
    ).join('');
    return '<text style="' + style(CREAM_CSS) + '"><textPath href="#' + pathId + '"' + pathAttrs + '>' + spans + '</textPath></text>';
  }

  // Full sentence with only one part visible (keeps its exact position)
  function handText(pathId, visibleIndex, colour) {
    const spans = PARTS.map((p, i) =>
      '<tspan style="visibility:' + (i === visibleIndex ? 'visible' : 'hidden') + '">' + p + '</tspan>'
    ).join('');
    return '<text style="' + style(colour) + '"><textPath href="#' + pathId + '"' + pathAttrs + '>' + spans + '</textPath></text>';
  }

  const disc   = document.getElementById('disc');
  const hourG  = document.getElementById('hourHand');
  const minG   = document.getElementById('minuteHand');

  disc.innerHTML  = ringText('topHalf') + ringText('bottomHalf');
  hourG.innerHTML = handText('topHalf', 1, HOUR_CSS);
  minG.innerHTML  = handText('topHalf', 3, MIN_CSS);


  // Where text sits on the ring, worked out from letter widths and the ring's size.
  // Browsers disagree when asked for letter positions on a curved path (Safari's engine,
  // used by every iPhone browser, answers differently), so the clock calculates them.
  // Each half of the ring is an arc of radius 170 around the centre; the text is centred
  // on it and stretched to TEXT_LEN by widening the gaps between letters.
  const RADIUS = 170, TEXT_LEN = 515, ARC_LEN = Math.PI * RADIUS;
  const ruler = document.createElement('canvas').getContext('2d');
  // Clock angle (degrees, 0 = 12 o'clock, clockwise) of the start and end of each character
  function charAngles(text, half) {
    ruler.font = '700 ' + FONT_SIZE + 'px ' + FONT;
    const n = text.length, x = [];
    for (let i = 0; i <= n; i++) x.push(ruler.measureText(text.slice(0, i)).width);
    const gap = (TEXT_LEN - x[n]) / (n - 1);
    const first = ARC_LEN / 2 - TEXT_LEN / 2;
    const from = half === 'top' ? -90 : 90; // top half runs 9 -> 12 -> 3, bottom half 3 -> 6 -> 9
    const deg = d => from + d / RADIUS * 180 / Math.PI;
    return [...text].map((c, i) => ({ start: deg(first + x[i] + i * gap), end: deg(first + x[i + 1] + i * gap) }));
  }

  // Where each word sits on the ring at rest, so it can be aimed at the right time
  function restAngle(firstChar, lastChar) {
    const a = charAngles(SENTENCE, 'top');
    return (a[firstChar].start + a[lastChar].end) / 2;
  }

  // Seconds: the sentence writes itself around the ring each minute. The newest letter is the
  // strongest colour; letters shift colour as new ones appear, then stay until the minute ends.
  // Each letter lights when a seconds hand would reach it, so :00 is at 12 o'clock.
  const allLetters = [...disc.querySelectorAll('tspan[data-ch]')];
  let letters = allLetters, starts = [];
  const lastFill = new Array(allLetters.length).fill('');
  function measureLetters() {
    const placed = [];
    let k = 0;
    for (const half of ['top', 'bottom']) {
      charAngles(SENTENCE, half).forEach((a, i) => {
        if (SENTENCE[i] === ' ') return;
        placed.push({ el: allLetters[k++], deg: (((a.start + a.end) / 2) % 360 + 360) % 360 });
      });
    }
    placed.sort((p, q) => p.deg - q.deg);
    letters = placed.map(p => p.el);
    starts = placed.map(p => p.deg / 6);
    lastFill.fill(''); // redraw every letter on the next frame
  }

  // Which letter is newest at second s (-1 = none yet this minute), and how long ago it appeared
  function head(s) {
    let c = -1;
    for (let k = 0; k < starts.length; k++) if (starts[k] <= s) c = k;
    return { c, u: c < 0 ? 0 : s - starts[c] };
  }
  // Colour for a letter that is x letters behind the newest one
  function trail(x) {
    for (let i = 1; i < TRAIL.length; i++) {
      if (x <= TRAIL[i][0]) return mix(TRAIL[i - 1][1], TRAIL[i][1], Math.max(0, (x - TRAIL[i - 1][0]) / (TRAIL[i][0] - TRAIL[i - 1][0])));
    }
    return TRAIL[TRAIL.length - 1][1];
  }
  // Colour of letter k at second s of the minute, as text ready to apply
  function letterColour(hd, k, s) {
    const n = letters.length, d = hd.c - k; // d = how many letters behind the newest one
    const wiping = s < WIPE;                // just after the minute turns, last minute's sentence fades out
    if (d < 0 && !wiping) return CREAM_CSS; // not written yet this minute
    const under = wiping ? mix(trail(n - 1 - k), CREAM, s / WIPE) : CREAM;
    if (d < 0) return css(under);
    if (d === 0) return css(mix(under, trail(0), Math.min(1, hd.u / FADE_IN))); // the newest letter appears
    return css(trail(d - 1 + Math.min(1, hd.u / FADE_DOWN)));                   // shifting, one step per letter
  }


  let homeHour = 0, homeMin = 0;
  function measure() {
    homeHour = restAngle(10, 20); // "broken wing"
    homeMin  = restAngle(28, 35); // "glock 19"
    measureLetters();
  }

  // Always take the short way around (no backwards spin at 12 / :00)
  function approach(cur, target) {
    if (cur === null) return target;
    const d = ((target - cur) % 360 + 540) % 360 - 180;
    return cur + d;
  }

  // Turning the hands. SVG's own rotate(angle, centre) is used because every browser
  // handles it the same way. The click-and-settle movement is the same curve as before,
  // cubic-bezier(.3,1.4,.5,1), worked out here instead of left to the browser.
  function curve(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
    return x => {
      let lo = 0, hi = 1, t = x;
      for (let i = 0; i < 30; i++) { if (X(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  }
  const settle = curve(.3, 1.4, .5, 1);
  function mover(g, seconds) {
    let from = null, to = null, start = 0, shown = '';
    const at = t => {
      const u = (t - start) / (seconds * 1000);
      return u >= 1 ? to : from + (to - from) * settle(Math.max(0, u));
    };
    return function (target, t) {
      if (to === null) { from = to = target; start = t - seconds * 1000; } // first frame: no movement
      else if (target !== to) { from = at(t); to = target; start = t; }
      const a = at(t), str = 'rotate(' + a.toFixed(2) + ' ' + CX + ' ' + CY + ')';
      if (str !== shown) { g.setAttribute('transform', str); shown = str; }
      return a;
    };
  }
  const moveHour = mover(hourG, 0.8), moveMin = mover(minG, 0.35);

  // Check page: add ?check=1 to the address to see what the clock is doing. Viewers never see it.
  const svgRoot = document.getElementById('clock');
  const checkBox = /[?&]check=1(&|$)/.test(location.search) ? document.createElement('pre') : null;
  if (checkBox) {
    checkBox.style.cssText = 'position:fixed;left:8px;top:8px;margin:0;padding:6px 8px;' +
      'background:#fff;color:#000;font:12px/1.5 monospace;z-index:9;white-space:pre';
    document.body.appendChild(checkBox);
  }
  const two = n => String(n).padStart(2, '0');
  const norm = d => ((d % 360) + 360) % 360;
  const hourText = d => { const mins = Math.round(norm(d) * 2) % 720; return (Math.floor(mins / 60) || 12) + ':' + two(mins % 60); };
  const minText2 = d => two(Math.round(norm(d) / 6) % 60) + ' min';
  function browserSees(textEl, first, last) {
    try {
      const a = textEl.getStartPositionOfChar(first), b = textEl.getEndPositionOfChar(last);
      const M = svgRoot.getScreenCTM().inverse().multiply(textEl.getScreenCTM());
      const p = svgRoot.createSVGPoint(); p.x = (a.x + b.x) / 2; p.y = (a.y + b.y) / 2;
      const q = p.matrixTransform(M);
      return Math.atan2(q.x - CX, -(q.y - CY)) * 180 / Math.PI;
    } catch (e) { return null; }
  }
  let lastCheck = 0;
  function check(now, hourDeg, minDeg, hourAt, minAt) {
    if (!checkBox || performance.now() - lastCheck < 500) return;
    lastCheck = performance.now();
    let zone = '';
    try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    const bh = browserSees(hourG.querySelector('text'), 10, 20), bm = browserSees(minG.querySelector('text'), 28, 35);
    checkBox.textContent =
      'Phone time   ' + two(now.getHours()) + ':' + two(now.getMinutes()) + ':' + two(now.getSeconds()) + '  ' + zone + '\n' +
      'Should show  hour ' + hourText(hourDeg) + '   minute ' + minText2(minDeg) + '\n' +
      'Placed at    hour ' + hourText(homeHour + hourAt) + '   minute ' + minText2(homeMin + minAt) + '\n' +
      'Browser sees hour ' + (bh === null ? 'cannot tell' : hourText(bh)) + '   minute ' + (bm === null ? 'cannot tell' : minText2(bm));
  }

  let curH = null, curM = null;

  function tick() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds() + now.getMilliseconds() / 1000;

    // Only touch letters whose brightness actually changes
    const hd = head(s);
    for (let k = 0; k < letters.length; k++) {
      // One solid colour for the whole letter, inside and edge together, so no outline ever shows
      const c = letterColour(hd, k, s);
      if (c !== lastFill[k]) { letters[k].style.fill = c; letters[k].style.stroke = c; lastFill[k] = c; }
    }

    const hourDeg = h * 30 + m * 0.5; // creeps between hours
    const minDeg  = m * 6;            // clicks each minute
    curH = approach(curH, hourDeg - homeHour);
    curM = approach(curM, minDeg - homeMin);
    const t = performance.now();
    const hourAt = moveHour(curH, t), minAt = moveMin(curM, t);
    check(now, hourDeg, minDeg, hourAt, minAt);

    requestAnimationFrame(tick);
  }

  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
