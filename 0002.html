<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>broken wing clock</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #E1FF00;                        /* background: A1.15 (standard screens) */
  }
  @supports (color: color(display-p3 1 1 1)) {
    body { background: color(display-p3 0.9 1 0); } /* background: A1.15 P3 */
  }
  #clock {
    width: min(90vw, 90vh);
    height: auto;
  }
</style>
</head>
<body>

<svg id="clock" viewBox="130 30 420 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clock made from the sentence its not a broken wing its a glock 19">
  <defs>
    <path id="topHalf" d="M170 220 A170 170 0 0 1 510 220" fill="none"/>
    <path id="bottomHalf" d="M510 220 A170 170 0 0 1 170 220" fill="none"/>
  </defs>
  <g id="disc"></g>       <!-- faint ring -->
  <g id="seconds"></g>    <!-- lit seconds letter -->
  <g id="hourHand"></g>   <!-- "broken wing" -->
  <g id="minuteHand"></g> <!-- "glock 19" -->
</svg>

<script>
(function () {
  // ---------- Settings ----------
  const SENTENCE      = 'its not a broken wing its a glock 19';
  const PARTS         = ['its not a ', 'broken wing', ' its a ', 'glock 19'];
  const FONT          = "'Futura', 'Futura PT', sans-serif";
  const FONT_SIZE     = 29;
  const DISC_OPACITY  = 0.6;  // faint ring
  const SECS_OPACITY  = 0.75; // lit seconds letter
  const HOUR_OPACITY  = 0.9;  // "broken wing"
  const MIN_OPACITY   = 1.0;  // "glock 19"
  const FADE_IN       = 0.12; // seconds for a letter to fill
  const LINGER        = 0.45; // seconds a letter stays lit after its second
  const CROSS_DEG     = 10;   // "glock 19" turns black when the words' centres are this close
  const CROSS_FADE    = 0.2;  // seconds for the black to fade in and out

  // Colours, each as [display-p3 values, standard-screen fallback]
  const P3 = window.CSS && CSS.supports && CSS.supports('color', 'color(display-p3 1 1 1)');
  const YELLOW = P3 ? [0.9, 1, 0]                : [0xE1 / 255, 1, 0];                    // A1.15 P3 / A1.15
  const RED    = P3 ? [0.8344, 0.1785, 0.1434]   : [0xE8 / 255, 0, 0x0F / 255];           // Red A.025 #E8000F
  const BLACK  = '#000000';
  const css = c => P3
    ? 'color(display-p3 ' + c.map(v => v.toFixed(4)).join(' ') + ')'
    : 'rgb(' + c.map(v => Math.round(v * 255)).join(',') + ')';
  const YELLOW_CSS = css(YELLOW), RED_CSS = css(RED);
  // ------------------------------

  const CX = 340, CY = 220;
  const style = "font-family:" + FONT + ";font-weight:700;font-size:" + FONT_SIZE +
    "px;stroke:" + RED_CSS + ";stroke-width:0.8px;stroke-linejoin:round;white-space:pre";
  const pathAttrs = ' startOffset="50%" text-anchor="middle" textLength="515" lengthAdjust="spacing"';

  // Ring with one tspan per character so each can light up
  function ringText(pathId) {
    const spans = [...SENTENCE].map(c =>
      '<tspan style="fill:' + YELLOW_CSS + '"' + (c === ' ' ? '' : ' data-ch="1"') + '>' + c + '</tspan>'
    ).join('');
    return '<text style="' + style + '"><textPath href="#' + pathId + '"' + pathAttrs + '>' + spans + '</textPath></text>';
  }

  // Same ring, red and invisible, laid over the faint ring; a letter shows when it is lit
  function secondsText(pathId) {
    const spans = [...SENTENCE].map(c =>
      '<tspan style="fill:' + RED_CSS + ';fill-opacity:0;stroke-opacity:0"' + (c === ' ' ? '' : ' data-ch="1"') + '>' + c + '</tspan>'
    ).join('');
    return '<text style="' + style + '"><textPath href="#' + pathId + '"' + pathAttrs + '>' + spans + '</textPath></text>';
  }

  // Full sentence with only one part visible (keeps its exact position)
  function handText(pathId, visibleIndex, fill) {
    const spans = PARTS.map((p, i) =>
      '<tspan style="visibility:' + (i === visibleIndex ? 'visible' : 'hidden') + '">' + p + '</tspan>'
    ).join('');
    return '<text style="' + style + ';fill:' + fill + '"><textPath href="#' + pathId + '"' + pathAttrs + '>' + spans + '</textPath></text>';
  }

  const disc   = document.getElementById('disc');
  const hourG  = document.getElementById('hourHand');
  const minG   = document.getElementById('minuteHand');
  const secsG  = document.getElementById('seconds');

  disc.innerHTML  = ringText('topHalf') + ringText('bottomHalf');
  secsG.innerHTML = secondsText('topHalf') + secondsText('bottomHalf');
  hourG.innerHTML = handText('topHalf', 1, RED_CSS);
  minG.innerHTML  = handText('topHalf', 3, RED_CSS);

  disc.setAttribute('opacity', DISC_OPACITY);
  secsG.setAttribute('opacity', SECS_OPACITY);
  hourG.setAttribute('opacity', HOUR_OPACITY);
  minG.setAttribute('opacity', MIN_OPACITY);

  for (const g of [hourG, minG]) {
    g.style.transformBox = 'view-box';
    g.style.transformOrigin = CX + 'px ' + CY + 'px';
  }

  // "glock 19" fades between red and black where the hands cross
  const minText = minG.querySelector('text');
  minText.style.transition = 'fill ' + CROSS_FADE + 's linear, stroke ' + CROSS_FADE + 's linear';

  // Where text sits on the ring, worked out from letter widths and the ring's size.
  // Browsers disagree when asked for letter positions on a curved path (Safari's engine,
  // used by every iPhone browser, answers differently), so the clock calculates them.
  // Each half of the ring is an arc of radius 170 around the centre; the text is centred
  // on it and stretched to TEXT_LEN by widening the gaps between letters.
  const RADIUS = 170, TEXT_LEN = 515, ARC_LEN = Math.PI * RADIUS;
  const ruler = document.createElement('canvas').getContext('2d');
  // Clock angle (degrees, 0 = 12 o'clock, clockwise) of the start and end of each character
  function charAngles(text, half) {
    ruler.font = '700 ' + FONT_SIZE + 'px ' + FONT;
    const n = text.length, x = [];
    for (let i = 0; i <= n; i++) x.push(ruler.measureText(text.slice(0, i)).width);
    const gap = (TEXT_LEN - x[n]) / (n - 1);
    const first = ARC_LEN / 2 - TEXT_LEN / 2;
    const from = half === 'top' ? -90 : 90; // top half runs 9 -> 12 -> 3, bottom half 3 -> 6 -> 9
    const deg = d => from + d / RADIUS * 180 / Math.PI;
    return [...text].map((c, i) => ({ start: deg(first + x[i] + i * gap), end: deg(first + x[i + 1] + i * gap) }));
  }

  // Where each word sits on the ring at rest, so it can be aimed at the right time
  function restAngle(firstChar, lastChar) {
    const a = charAngles(SENTENCE, 'top');
    return (a[firstChar].start + a[lastChar].end) / 2;
  }

  // Seconds: one lit letter travels around the ring each minute.
  // Each letter lights when a seconds hand would reach it, so :00 is at 12 o'clock.
  const allLetters = [...secsG.querySelectorAll('tspan[data-ch]')];
  let letters = allLetters, starts = [], ends = [];
  function measureLetters() {
    const placed = [];
    let k = 0;
    for (const half of ['top', 'bottom']) {
      charAngles(SENTENCE, half).forEach((a, i) => {
        if (SENTENCE[i] === ' ') return;
        placed.push({ el: allLetters[k++], deg: (((a.start + a.end) / 2) % 360 + 360) % 360 });
      });
    }
    placed.sort((p, q) => p.deg - q.deg);
    letters = placed.map(p => p.el);
    starts = placed.map(p => p.deg / 6);
    ends = starts.map((s, i) => i + 1 < starts.length ? starts[i + 1] : 60);
  }

  function level(s, k) {
    const start = starts[k], end = ends[k];
    let v = 0;
    for (const t of [s, s + 60]) { // s + 60 lets the last letter fade past the minute
      if (t >= start && t < end) v = Math.max(v, Math.min(1, (t - start) / FADE_IN));
      else if (t >= end)        v = Math.max(v, Math.max(0, 1 - (t - end) / LINGER));
    }
    return v;
  }


  let homeHour = 0, homeMin = 0;
  function measure() {
    homeHour = restAngle(10, 20); // "broken wing"
    homeMin  = restAngle(28, 35); // "glock 19"
    measureLetters();
  }

  // Always take the short way around (no backwards spin at 12 / :00)
  function approach(cur, target) {
    if (cur === null) return target;
    const d = ((target - cur) % 360 + 540) % 360 - 180;
    return cur + d;
  }

  let curH = null, curM = null, ready = false, crossed = null;
  const lastFill = new Array(allLetters.length).fill('');
  let lastH = '', lastM = '';

  function tick() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const s = now.getSeconds() + now.getMilliseconds() / 1000;

    // Only touch letters whose brightness actually changes
    for (let k = 0; k < letters.length; k++) {
      const f = level(s, k).toFixed(3);
      if (f !== lastFill[k]) { letters[k].style.fillOpacity = f; letters[k].style.strokeOpacity = f; lastFill[k] = f; }
    }

    const hourDeg = h * 30 + m * 0.5; // creeps between hours
    const minDeg  = m * 6;            // clicks each minute
    curH = approach(curH, hourDeg - homeHour);
    curM = approach(curM, minDeg - homeMin);
    const th = 'rotate(' + curH + 'deg)', tm = 'rotate(' + curM + 'deg)';
    if (th !== lastH) { hourG.style.transform = th; lastH = th; }
    if (tm !== lastM) { minG.style.transform = tm; lastM = tm; }

    const gap = Math.abs(((hourDeg - minDeg) % 360 + 540) % 360 - 180);
    const isCrossed = gap < CROSS_DEG;
    if (isCrossed !== crossed) {
      crossed = isCrossed;
      const c = isCrossed ? BLACK : RED_CSS;
      minText.style.fill = c;
      minText.style.stroke = c;
    }

    if (!ready) {
      ready = true;
      requestAnimationFrame(() => {
        hourG.style.transition = 'transform 0.8s cubic-bezier(.3,1.4,.5,1)';
        minG.style.transition  = 'transform 0.35s cubic-bezier(.3,1.4,.5,1)';
      });
    }
    requestAnimationFrame(tick);
  }

  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
