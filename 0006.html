<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>broken wing clock</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
  }
  #clock {
    width: min(90vw, 90vh);
    height: auto;
  }
</style>
</head>
<body>

<svg id="clock" viewBox="130 10 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clock made from the sentence its not a broken wing its a glock 19">
  <defs>
    <path id="topHalf" d="M170 220 A170 170 0 0 1 510 220" fill="none"/>
    <path id="bottomHalf" d="M510 220 A170 170 0 0 1 170 220" fill="none"/>
  </defs>
  <g id="disc"></g>       <!-- ring: turns one step each second; at :00 everything is yellow for a second -->
  <g id="hourHand"></g>   <!-- "broken wing" -->
  <g id="minuteHand"></g> <!-- "glock 19" -->
</svg>

<script>
(function () {
  // ---------- Settings ----------
  const SENTENCE      = 'its not a broken wing its a glock 19';
  const PARTS         = ['its not a ', 'broken wing', ' its a ', 'glock 19'];
  const FONT          = "'Futura', 'Futura PT', sans-serif";
  const FONT_SIZE     = 29;
  const RING_LINE     = 0.85; // outline weight of both sentences on the ring
  const HAND_LINE     = 0.8;  // edge of the hands, drawn in each hand's own colour
  const STEP_TIME     = 0.3;  // seconds for the ring to click round one step
  const YELLOW_IN     = 0.12; // seconds for everything to turn yellow when the ring completes its turn, at :00
  const YELLOW_OUT    = 0.3;  // seconds for everything to turn back, at :01

  // Colours: wide-gamut where the screen has it, with standard colours as the fallback
  const P3 = window.CSS && CSS.supports && CSS.supports('color', 'color(display-p3 1 1 1)');
  const RED    = P3 ? [0.8344, 0.1785, 0.1434] : [0xE8 / 255, 0, 0x0F / 255]; // "broken wing": red from 0002
  const BLACK  = [0, 0, 0];                                                   // "glock 19"
  const GREY   = [0xB8 / 255, 0xB8 / 255, 0xB8 / 255];                        // both sentences on the ring
  const YELLOW = P3 ? [0.9, 1, 0]              : [0xE1 / 255, 1, 0];          // the yellow second: hi-viz yellow from 0002
  const css = c => P3
    ? 'color(display-p3 ' + c.map(v => v.toFixed(4)).join(' ') + ')'
    : 'rgb(' + c.map(v => Math.round(v * 255)).join(',') + ')';
  // One solid colour part-way between two. Nothing is ever see-through, so no edge or overlap shows.
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  // ------------------------------

  const CX = 340, CY = 220;
  const style = (stroke, line, fill) => "font-family:" + FONT + ";font-weight:700;font-size:" + FONT_SIZE +
    "px;fill:" + fill + ";stroke:" + stroke + ";stroke-width:" + line + "px;stroke-linejoin:round;white-space:pre";
  const pathAttrs = ' startOffset="50%" text-anchor="middle" textLength="515" lengthAdjust="spacing"';

  // One sentence of the ring, as outlines with nothing inside
  function ringText(pathId) {
    return '<text style="' + style(css(GREY), RING_LINE, 'none') + '"><textPath href="#' + pathId + '"' + pathAttrs + '>' + SENTENCE + '</textPath></text>';
  }

  // Full sentence with only one part visible (keeps its exact position)
  function handText(pathId, visibleIndex, colour) {
    const spans = PARTS.map((p, i) =>
      '<tspan style="visibility:' + (i === visibleIndex ? 'visible' : 'hidden') + '">' + p + '</tspan>'
    ).join('');
    return '<text style="' + style(css(colour), HAND_LINE, css(colour)) + '"><textPath href="#' + pathId + '"' + pathAttrs + '>' + spans + '</textPath></text>';
  }

  const disc   = document.getElementById('disc');
  const hourG  = document.getElementById('hourHand');
  const minG   = document.getElementById('minuteHand');

  // The two sentences are the same, so the ring looks the same every half turn
  disc.innerHTML  = ringText('topHalf') + ringText('bottomHalf');
  hourG.innerHTML = handText('topHalf', 1, RED);
  minG.innerHTML  = handText('topHalf', 3, BLACK);
  const ringEls = [...disc.querySelectorAll('text')];
  const hourEl  = hourG.querySelector('text');
  const minEl   = minG.querySelector('text');

  // Where text sits on the ring, worked out from letter widths and the ring's size.
  // Browsers disagree when asked for letter positions on a curved path (Safari's engine,
  // used by every iPhone browser, answers differently), so the clock calculates them.
  // Each half of the ring is an arc of radius 170 around the centre; the text is centred
  // on it and stretched to TEXT_LEN by widening the gaps between letters.
  const RADIUS = 170, TEXT_LEN = 515, ARC_LEN = Math.PI * RADIUS;
  const ruler = document.createElement('canvas').getContext('2d');
  // Clock angle (degrees, 0 = 12 o'clock, clockwise) of the start and end of each character
  function charAngles(text, half) {
    ruler.font = '700 ' + FONT_SIZE + 'px ' + FONT;
    const n = text.length, x = [];
    for (let i = 0; i <= n; i++) x.push(ruler.measureText(text.slice(0, i)).width);
    const gap = (TEXT_LEN - x[n]) / (n - 1);
    const first = ARC_LEN / 2 - TEXT_LEN / 2;
    const from = half === 'top' ? -90 : 90; // top half runs 9 -> 12 -> 3, bottom half 3 -> 6 -> 9
    const deg = d => from + d / RADIUS * 180 / Math.PI;
    return [...text].map((c, i) => ({ start: deg(first + x[i] + i * gap), end: deg(first + x[i + 1] + i * gap) }));
  }

  // Where each word sits on the ring at rest, so it can be aimed at the right time
  function restAngle(firstChar, lastChar) {
    const a = charAngles(SENTENCE, 'top');
    return (a[firstChar].start + a[lastChar].end) / 2;
  }

  let homeHour = 0, homeMin = 0;
  function measure() {
    homeHour = restAngle(10, 20); // "broken wing"
    homeMin  = restAngle(28, 35); // "glock 19"
  }

  // Always take the short way around (no backwards spin at 12 / :00)
  function approach(cur, target) {
    if (cur === null) return target;
    const d = ((target - cur) % 360 + 540) % 360 - 180;
    return cur + d;
  }

  // Turning the hands. SVG's own rotate(angle, centre) is used because every browser
  // handles it the same way. The click-and-settle movement is the same curve as before,
  // cubic-bezier(.3,1.4,.5,1), worked out here instead of left to the browser.
  function curve(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
    return x => {
      let lo = 0, hi = 1, t = x;
      for (let i = 0; i < 30; i++) { if (X(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return Y(t);
    };
  }
  const settle = curve(.3, 1.4, .5, 1);
  function mover(g, seconds) {
    let from = null, to = null, start = 0, shown = '';
    const at = t => {
      const u = (t - start) / (seconds * 1000);
      return u >= 1 ? to : from + (to - from) * settle(Math.max(0, u));
    };
    return function (target, t) {
      if (to === null) { from = to = target; start = t - seconds * 1000; } // first frame: no movement
      else if (target !== to) { from = at(t); to = target; start = t; }
      const a = at(t), str = 'rotate(' + a.toFixed(2) + ' ' + CX + ' ' + CY + ')';
      if (str !== shown) { g.setAttribute('transform', str); shown = str; }
      return a;
    };
  }
  const moveHour = mover(hourG, 0.8), moveMin = mover(minG, 0.35), moveRing = mover(disc, STEP_TIME);

  // The yellow second. The ring completes a full turn at :00; for that second everything
  // is yellow. The answer is 0 (normal colours) to 1 (all yellow), worked out from the time
  // alone, so the clock is right whenever the page is opened or woken.
  function yellowLevel(sec, part) { // part: how far through the second, 0 to 1
    if (sec === 0) return Math.min(1, part / YELLOW_IN);
    if (sec === 1) return Math.max(0, 1 - part / YELLOW_OUT);
    return 0;
  }
  // Colours are only written when they change
  let shownLevel = -1;
  function colour(level) {
    if (level === shownLevel) return;
    shownLevel = level;
    const ring = css(mix(GREY, YELLOW, level)), hour = css(mix(RED, YELLOW, level)), min = css(mix(BLACK, YELLOW, level));
    for (const el of ringEls) el.style.stroke = ring;
    hourEl.style.fill = hour; hourEl.style.stroke = hour;
    minEl.style.fill  = min;  minEl.style.stroke  = min;
  }

  // Check page: add ?check=1 to the address to see what the clock is doing. Viewers never see it.
  const svgRoot = document.getElementById('clock');
  const checkBox = /[?&]check=1(&|$)/.test(location.search) ? document.createElement('pre') : null;
  if (checkBox) {
    checkBox.style.cssText = 'position:fixed;left:8px;top:8px;margin:0;padding:6px 8px;' +
      'background:#fff;color:#000;font:12px/1.5 monospace;z-index:9;white-space:pre';
    document.body.appendChild(checkBox);
  }
  const two = n => String(n).padStart(2, '0');
  const norm = d => ((d % 360) + 360) % 360;
  const hourText = d => { const mins = Math.round(norm(d) * 2) % 720; return (Math.floor(mins / 60) || 12) + ':' + two(mins % 60); };
  const minText2 = d => two(Math.round(norm(d) / 6) % 60) + ' min';
  function browserSees(textEl, first, last) {
    try {
      const a = textEl.getStartPositionOfChar(first), b = textEl.getEndPositionOfChar(last);
      const M = svgRoot.getScreenCTM().inverse().multiply(textEl.getScreenCTM());
      const p = svgRoot.createSVGPoint(); p.x = (a.x + b.x) / 2; p.y = (a.y + b.y) / 2;
      const q = p.matrixTransform(M);
      return Math.atan2(q.x - CX, -(q.y - CY)) * 180 / Math.PI;
    } catch (e) { return null; }
  }
  let lastCheck = 0;
  function check(now, hourDeg, minDeg, hourAt, minAt, ringAt, level) {
    if (!checkBox || performance.now() - lastCheck < 500) return;
    lastCheck = performance.now();
    let zone = '';
    try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    const bh = browserSees(hourEl, 10, 20), bm = browserSees(minEl, 28, 35);
    checkBox.textContent =
      'Phone time   ' + two(now.getHours()) + ':' + two(now.getMinutes()) + ':' + two(now.getSeconds()) + '  ' + zone + '\n' +
      'Should show  hour ' + hourText(hourDeg) + '   minute ' + minText2(minDeg) + '\n' +
      'Placed at    hour ' + hourText(homeHour + hourAt) + '   minute ' + minText2(homeMin + minAt) + '\n' +
      'Browser sees hour ' + (bh === null ? 'cannot tell' : hourText(bh)) + '   minute ' + (bm === null ? 'cannot tell' : minText2(bm)) + '\n' +
      'Ring at      ' + two(Math.round(norm(ringAt) / 6) % 60) + ' sec   ' + (level > 0 ? 'yellow' : 'normal colours');
  }

  let curH = null, curM = null, curS = null;

  function tick() {
    const now = new Date();
    const h = now.getHours() % 12;
    const m = now.getMinutes();
    const sec = now.getSeconds();

    const hourDeg = h * 30 + m * 0.5; // creeps between hours
    const minDeg  = m * 6;            // clicks each minute
    curH = approach(curH, hourDeg - homeHour);
    curM = approach(curM, minDeg - homeMin);
    curS = approach(curS, sec * 6);   // the ring: 60 even steps a minute, always clockwise
    const t = performance.now();
    const hourAt = moveHour(curH, t), minAt = moveMin(curM, t), ringAt = moveRing(curS, t);
    const level = yellowLevel(sec, now.getMilliseconds() / 1000);
    colour(level);
    check(now, hourDeg, minDeg, hourAt, minAt, ringAt, level);

    requestAnimationFrame(tick);
  }

  measure();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
